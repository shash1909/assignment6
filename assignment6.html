<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Assignment 6</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: black;
    }

    nav a.active {
      font-weight: bold;
      color: blue;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .gallery {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .gallery img {
      width: 100px;
      cursor: pointer;
      border-radius: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 80%;
      max-height: 80%;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
    }

    .form-section {
      margin: 20px 0;
    }

    .total {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <nav>
    <a href="#home" class="active">Home</a>
    <a href="#packages">Packages</a>
    <a href="#gallery">Gallery</a>
  </nav>

  <section id="packages">
    <h2>Packages</h2>
    <table id="packagesTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Destination</th>
          <th>Duration</th>
          <th>Base Price</th>
          <th>Season</th>
          <th>Final Price</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="form-section">
    <h2>Booking Price Estimator</h2>
    <form id="bookingForm">
      <label>Check In: <input type="date" id="checkIn" required></label><br><br>
      <label>Check Out: <input type="date" id="checkOut" required></label><br><br>
      <label>Guests: <input type="number" id="guests" min="1" required></label><br><br>
      <label>Package:
        <select id="packageSelect"></select>
      </label><br><br>
      <label>Promo Code: <input type="text" id="promo"></label><br><br>
      <button type="submit" disabled>Book Now</button>
      <div class="total" id="total"></div>
    </form>
  </section>

  <section id="gallery">
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"
        data-large="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Beach">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400"
        data-large="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400" alt="Mountain">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200"
        data-large="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200" alt="Forest">
    </div>
  </section>

  <div class="modal" id="modal">
    <img id="modalImg" src="">
  </div>

  <script>
    const packages = [
      { id: 1, destination: "Goa", durationDays: 5, basePrice: 10000, season: "peak" },
      { id: 2, destination: "Manali", durationDays: 7, basePrice: 15000, season: "off" },
      { id: 3, destination: "Kerala", durationDays: 6, basePrice: 12000, season: "normal" }
    ]

    const tbody = document.querySelector("#packagesTable tbody")
    const packageSelect = document.getElementById("packageSelect")

    packages.forEach(p => {
      let multiplier = 1
      switch (p.season) {
        case "peak": multiplier = 1.5; break
        case "off": multiplier = 0.8; break
        default: multiplier = 1
      }
      const finalPrice = p.basePrice * multiplier
      const row = document.createElement("tr")
      row.innerHTML = `
        <td>${p.id}</td>
        <td>${p.destination}</td>
        <td>${p.durationDays}</td>
        <td>${p.basePrice}</td>
        <td>${p.season}</td>
        <td>${finalPrice}</td>
      `
      tbody.appendChild(row)
      const opt = document.createElement("option")
      opt.value = p.basePrice
      opt.textContent = p.destination
      packageSelect.appendChild(opt)
    })

    const form = document.getElementById("bookingForm")
    const checkIn = document.getElementById("checkIn")
    const checkOut = document.getElementById("checkOut")
    const guests = document.getElementById("guests")
    const promo = document.getElementById("promo")
    const totalDiv = document.getElementById("total")
    const submitBtn = form.querySelector("button")

    function calculateTotal() {
      if (!checkIn.value || !checkOut.value || !guests.value || !packageSelect.value) {
        submitBtn.disabled = true
        totalDiv.textContent = ""
        return
      }
      const nights = (new Date(checkOut.value) - new Date(checkIn.value)) / (1000 * 60 * 60 * 24)
      if (nights <= 0) {
        submitBtn.disabled = true
        totalDiv.textContent = ""
        return
      }
      let price = nights * Number(packageSelect.value)
      if (guests.value > 2) price *= 1.2
      switch (promo.value.trim().toUpperCase()) {
        case "EARLYBIRD": price *= 0.9; break
        case "FESTIVE": price *= 0.85; break
      }
      totalDiv.textContent = "Total: ₹" + price.toFixed(2)
      submitBtn.disabled = false
    }

    form.addEventListener("input", calculateTotal)

    const galleryImgs = document.querySelectorAll(".gallery img")
    const modal = document.getElementById("modal")
    const modalImg = document.getElementById("modalImg")
    galleryImgs.forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex"
        modalImg.src = img.dataset.large
        modalImg.alt = img.alt
        modalImg.title = img.alt
      })
    })
    modal.addEventListener("click", () => {
      modal.style.display = "none"
    })

    const navLinks = document.querySelectorAll("nav a")
    navLinks.forEach(link => {
      link.addEventListener("click", () => {
        navLinks.forEach(l => l.classList.remove("active"))
        link.classList.add("active")
      })
    })
  </script>
</body>

</html>
